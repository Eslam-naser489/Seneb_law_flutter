name: seneb_law
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  intl: any

  cupertino_icons: ^1.0.8
  lottie: ^3.6.1
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  go_router: ^18.1.1
  drift: ^2.35.2
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.1
  uuid: ^4.6.0
  crypto: ^3.0.7
  cryptography: ^2.9.0
  url_launcher: ^6.3.3
  sqlite3: ^3.8.0
  file_picker: ^13.3.2
  open_filex: ^5.0.0
  pdf: ^3.13.1
  printing: ^5.15.1
  flutter_local_notifications: ^23.0.1
  timezone: ^0.11.2
  share_plus: ^13.3.1
  archive: ^4.7.1
  xml: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.16.2

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lottie/
    - assets/fonts/

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
